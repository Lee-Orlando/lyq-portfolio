<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间 · Lyq</title>

    <meta name="description" content="Lyq 个人站点里的一个空间。">
    <meta name="author" content="Lyq">
    <meta name="theme-color" content="#0a0a0a">

    <meta property="og:type" content="article">
    <meta property="og:title" content="空间 · Lyq">
    <meta property="og:description" content="Lyq 个人站点里的一个空间。">
    <meta property="og:image" content="og-image.svg">
    <meta name="twitter:card" content="summary">

    <!-- 内容接口：真实地址在 site.config.js（被 gitignore），这里留空只作兜底 -->
    <meta name="content-endpoint" content="">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23FFD700' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header id="mainHeader" class="main-header">
        <div class="container">
            <a href="index.html" class="logo">Lyq</a>
            <nav class="main-nav" aria-label="主导航">
                <ul>
                    <li><a href="index.html#hero">首页</a></li>
                    <li><a href="index.html#about">关于</a></li>
                    <li><a href="index.html#contact">联系</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main">
        <!-- 内容全部来自云端，所以这里只有骨架：标题、正文、以及三种状态提示。
             哪个是哪个由 js/space.js 决定，找不到空间时会把正文收起来、只留提示。 -->
        <section class="space-detail section" id="spaceDetail">
            <div class="container">
                <a class="back-link" href="index.html#spaces">← 返回全部空间</a>

                <h1 class="space-detail-title" id="spaceTitle">正在加载…</h1>
                <div class="space-detail-body" id="spaceBody"></div>

                <!-- 这个页面自带一套编辑器，跟首页右侧那个抽屉面板是两回事：
                     首页的抽屉管整站文案和空间清单，这里只改当前这一个空间的名字、文字和图片。
                     之所以分开，是因为站在这里改内容时，眼睛看到的排版就是访客看到的排版，
                     不用在抽屉里想象它长什么样。 -->
                <!-- 状态条放在编辑器外面：保存成功后编辑器会收起来，提示得留得住 -->
                <p class="editor-status" id="editorStatus" role="status" aria-live="polite" hidden></p>

                <div class="space-editor" id="spaceEditor" hidden>
                    <p class="editor-hint">只改这个空间。改完点保存，访客刷新就能看到。</p>

                    <div class="form-group">
                        <label for="editName">空间名字</label>
                        <input type="text" id="editName" maxlength="40" autocomplete="off">
                    </div>

                    <div id="editBlocks"></div>

                    <div class="editor-actions">
                        <button type="button" class="submit-button" id="editSave">保存这个空间</button>
                        <button type="button" class="ghost-button" id="editCancel">取消</button>
                    </div>
                </div>

                <p class="space-notice" id="spaceNotice" hidden></p>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-copyright">
                <p>&copy; <span id="copyright-year"></span> Lyq. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 空间内容存在云端，禁用 JS 时这里什么都拿不到。
         如实说明并把人送回首页，而不是留一个看起来像坏了的页面。 -->
    <noscript>
        <style>
            .space-detail-title { display: none; }
        </style>
        <div class="container">
            <p class="space-notice">这个页面的内容需要从云端读取，请开启 JavaScript，或<a href="index.html">回到首页</a>。</p>
        </div>
    </noscript>

    <!-- 编辑入口：就地打开本页的编辑器，不跳回首页。
         默认隐藏——内容还没从云端取回来之前，开了编辑器也不知道在改什么。 -->
    <button type="button" class="admin-fab" id="adminFab" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
        <span id="adminFabLabel">编辑这个空间</span>
    </button>

    <script src="site.config.js" defer></script>
    <script src="js/space.js" defer></script>
</body>
</html>
